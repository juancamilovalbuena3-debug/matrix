<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Motrix</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white min-h-screen">

<!-- HEADER -->
<header class="bg-gray-200 p-4 shadow">
    <h2 class="font-semibold text-xl text-black">
        Motrix
    </h2>
</header>

<div class="py-12">
    <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
        <div class="bg-white overflow-hidden shadow-xl sm:rounded-lg flex">

            <!-- SIDEBAR -->
            <aside class="w-64 bg-gray-100 border-r p-6">
                <h2 class="text-lg font-bold mb-4">Panel</h2>

                <ul class="space-y-2">
                    <li><a th:href="@{/dashboard}" class="text-black font-semibold">Inicio</a></li>
                    <li><a th:href="@{/empleados}" class="text-black font-semibold">Empleados</a></li>
                    <li><a th:href="@{/carros}" class="text-black font-semibold">Carros</a></li>
                    <li><a th:href="@{/motos}" class="text-black font-semibold">Motos</a></li>
                    <li><a th:href="@{/vender}" class="text-black font-semibold">Vender Vehículo</a></li>
                    <li><a th:href="@{/configuracion}" class="text-black font-semibold">Configuración</a></li>

                    <!-- Logout -->
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="text-red-600 mt-2 font-semibold">Cerrar sesión</button>
                    </form>
                </ul>
            </aside>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="flex-1 p-6">
                <h1 class="text-2xl font-bold mb-4">Bienvenido a Motrix</h1>
                <p class="mb-4 font-medium">“Tu aventura empieza con Motrix”.</p>

                <div class="mt-8 bg-gray-100 p-6 rounded-lg shadow text-center">
                    <h3 class="text-lg font-semibold mb-2">Panel Principal</h3>
                    <p class="text-gray-700">
                        Desde aquí puedes navegar a las secciones de empleados, vehículos, configuración y más.
                    </p>
                </div>
            </main>

        </div>
    </div>
</div>

</body>
</html>
